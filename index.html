<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="破题">
  <title>数学破题训练</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="stat"><span class="stat-label">今日待练</span><strong id="stat-due">0</strong></div>
      <div class="stat"><span class="stat-label">今日新题</span><strong id="stat-new">0</strong></div>
      <div class="stat"><span class="stat-label">连续天数</span><strong id="stat-streak">0</strong></div>
    </header>
    <main id="view" class="view"></main>
    <nav id="tabs" role="tablist">
      <button class="tab is-active" data-route="review" type="button">刷题</button>
      <button class="tab" data-route="library" type="button">题库</button>
      <button class="tab" data-route="fav" type="button">收藏</button>
      <button class="tab" data-route="settings" type="button">设置</button>
    </nav>
  </div>
  <div id="toast" class="toast" hidden></div>
  <div id="boot-error" class="boot-error" hidden></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
